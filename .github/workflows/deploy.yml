name: Publicar

# Quando roda:
#  - depois do "Version bump (PATCH)" na main (workflow_run): publica a main
#    JÁ com o VERSION incrementado, para o rodapé do site mostrar a versão
#    certa (o commit do robô não dispara workflows por conta própria);
#  - quando você clica em "Run workflow" na aba Actions (só na main).
on:
  workflow_run:
    workflows: ['Version bump (PATCH)']
    types: [completed]
    branches: ['main']
  workflow_dispatch: {}

permissions:
  contents: read

# Um deploy por vez; um deploy em andamento nunca é cancelado no meio do
# rsync (o seguinte espera).
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  validar:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && contains(fromJSON('["success","skipped"]'), github.event.workflow_run.conclusion))
    uses: ./.github/workflows/validar.yml
    with:
      artefato: true

  publicar:
    name: Publicar no servidor (rsync/SSH)
    needs: validar
    runs-on: ubuntu-latest
    # Secrets podem ficar no ambiente "producao" (Settings → Environments),
    # onde também dá para exigir aprovação antes de publicar.
    environment:
      name: producao
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Baixar os scripts de deploy
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Baixar o dist/ validado
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      # Pula (sem falhar) se os secrets ainda não estiverem configurados.
      - name: Publicar (rsync/SSH)
        id: deploy
        run: bash .github/scripts/deploy.sh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BANCAZEN_DADOS: ${{ vars.BANCAZEN_DADOS }}

      - name: Verificar o site publicado
        if: steps.deploy.outputs.publicado == 'sim'
        run: bash .github/scripts/verificar-site.sh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
